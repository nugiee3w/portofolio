<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <linearGradient id="bg-pustaka" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow-figma" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#AFFF00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" rx="36" fill="url(#bg-pustaka)"/>
  <rect x="2" y="2" width="796" height="996" rx="34" stroke="#27272a" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>

  <!-- Top Mockup Window Header (Figma Design Concept) -->
  <rect x="40" y="40" width="720" height="52" rx="14" fill="#27272a"/>
  <circle cx="70" cy="66" r="7" fill="#ef4444"/>
  <circle cx="94" cy="66" r="7" fill="#eab308"/>
  <circle cx="118" cy="66" r="7" fill="#22c55e"/>
  <rect x="150" y="52" width="340" height="28" rx="8" fill="#18181b"/>
  <text x="170" y="70" fill="#a1a1aa" font-family="monospace" font-size="12">figma.com/@anugrah / PustakaGo-UIUX</text>
  <rect x="635" y="52" width="105" height="28" rx="8" fill="#AFFF00" fill-opacity="0.15"/>
  <text x="687" y="70" fill="#AFFF00" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">UI/UX FIGMA</text>

  <!-- Main System UI Preview -->
  <g transform="translate(40, 115)">
    <!-- Sidebar -->
    <rect x="0" y="0" width="180" height="820" rx="16" fill="#18181b" stroke="#27272a"/>
    <rect x="20" y="24" width="36" height="36" rx="10" fill="#AFFF00"/>
    <text x="38" y="48" fill="#121212" font-family="sans-serif" font-weight="900" font-size="20" text-anchor="middle">P</text>
    <text x="68" y="47" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">PustakaGo</text>

    <!-- Nav Items -->
    <rect x="16" y="86" width="148" height="34" rx="8" fill="#AFFF00" fill-opacity="0.15"/>
    <rect x="16" y="86" width="4" height="34" rx="2" fill="#AFFF00"/>
    <text x="36" y="107" fill="#AFFF00" font-family="sans-serif" font-size="12" font-weight="600">Katalog Buku</text>

    <text x="36" y="145" fill="#a1a1aa" font-family="sans-serif" font-size="12">Peminjaman Aktif</text>
    <text x="36" y="180" fill="#a1a1aa" font-family="sans-serif" font-size="12">Riwayat Pengembalian</text>
    <text x="36" y="215" fill="#a1a1aa" font-family="sans-serif" font-size="12">Kategori &amp; Rak Buku</text>
    <text x="36" y="250" fill="#a1a1aa" font-family="sans-serif" font-size="12">Kartu Anggota Digital</text>
    <text x="36" y="285" fill="#a1a1aa" font-family="sans-serif" font-size="12">Wireframe &amp; Prototype</text>

    <!-- Main Content Area -->
    <g transform="translate(200, 0)">
      <!-- Top Metric Cards -->
      <g>
        <rect x="0" y="0" width="160" height="90" rx="14" fill="#18181b" stroke="#27272a"/>
        <text x="16" y="28" fill="#71717a" font-family="sans-serif" font-size="11">Total Koleksi Buku</text>
        <text x="16" y="60" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900">1,420</text>
        <rect x="16" y="70" width="85" height="4" rx="2" fill="#AFFF00"/>
      </g>
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="160" height="90" rx="14" fill="#18181b" stroke="#27272a"/>
        <text x="16" y="28" fill="#71717a" font-family="sans-serif" font-size="11">Buku Dipinjam</text>
        <text x="16" y="60" fill="#AFFF00" font-family="sans-serif" font-size="24" font-weight="900">148 Eks.</text>
        <rect x="16" y="70" width="110" height="4" rx="2" fill="#AFFF00"/>
      </g>
      <g transform="translate(350, 0)">
        <rect x="0" y="0" width="170" height="90" rx="14" fill="#18181b" stroke="#27272a"/>
        <text x="16" y="28" fill="#71717a" font-family="sans-serif" font-size="11">Design Tool</text>
        <text x="16" y="60" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Figma</text>
        <circle cx="140" cy="45" r="8" fill="#AFFF00" opacity="0.8"/>
      </g>

      <!-- Book Catalog Interface Preview -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="520" height="340" rx="16" fill="#18181b" stroke="#27272a"/>
        <text x="24" y="34" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Katalog &amp; Alur Peminjaman Buku</text>
        <text x="24" y="52" fill="#71717a" font-family="sans-serif" font-size="11">Desain Antarmuka Pengguna (UI) dan Prototipe Interaktif</text>

        <!-- Search Bar Mock -->
        <rect x="24" y="72" width="472" height="40" rx="10" fill="#121214" stroke="#27272a"/>
        <text x="40" y="96" fill="#71717a" font-family="sans-serif" font-size="11">Cari judul buku, penulis, atau nomor ISBN...</text>

        <!-- Book Cards Grid (UI Mockup) -->
        <g transform="translate(24, 128)">
          <!-- Book 1 -->
          <g>
            <rect x="0" y="0" width="145" height="180" rx="10" fill="#121214" stroke="#27272a"/>
            <rect x="12" y="12" width="121" height="85" rx="6" fill="#27272a"/>
            <text x="72" y="58" fill="#AFFF00" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">UI Design 101</text>
            <text x="12" y="118" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Dasar UI/UX</text>
            <text x="12" y="134" fill="#71717a" font-family="sans-serif" font-size="9">Don Norman</text>
            <rect x="12" y="146" width="121" height="24" rx="6" fill="#AFFF00" fill-opacity="0.15"/>
            <text x="72" y="162" fill="#AFFF00" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Pinjam Buku</text>
          </g>

          <!-- Book 2 -->
          <g transform="translate(163, 0)">
            <rect x="0" y="0" width="145" height="180" rx="10" fill="#121214" stroke="#27272a"/>
            <rect x="12" y="12" width="121" height="85" rx="6" fill="#27272a"/>
            <text x="72" y="58" fill="#AFFF00" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Clean Code</text>
            <text x="12" y="118" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Clean Software</text>
            <text x="12" y="134" fill="#71717a" font-family="sans-serif" font-size="9">Robert C. Martin</text>
            <rect x="12" y="146" width="121" height="24" rx="6" fill="#AFFF00" fill-opacity="0.15"/>
            <text x="72" y="162" fill="#AFFF00" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Pinjam Buku</text>
          </g>

          <!-- Book 3 -->
          <g transform="translate(326, 0)">
            <rect x="0" y="0" width="145" height="180" rx="10" fill="#121214" stroke="#27272a"/>
            <rect x="12" y="12" width="121" height="85" rx="6" fill="#27272a"/>
            <text x="72" y="58" fill="#AFFF00" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Design Sprint</text>
            <text x="12" y="118" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Product Sprint</text>
            <text x="12" y="134" fill="#71717a" font-family="sans-serif" font-size="9">Jake Knapp</text>
            <rect x="12" y="146" width="121" height="24" rx="6" fill="#27272a"/>
            <text x="72" y="162" fill="#71717a" font-family="sans-serif" font-size="9" text-anchor="middle">Sedang Dipinjam</text>
          </g>
        </g>
      </g>

      <!-- UI/UX Process & Figma Component System Preview -->
      <g transform="translate(0, 470)">
        <rect x="0" y="0" width="520" height="350" rx="16" fill="#18181b" stroke="#27272a"/>
        <text x="24" y="34" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Figma Design System &amp; User Flow</text>
        <text x="24" y="52" fill="#71717a" font-family="sans-serif" font-size="11">Desain Komponen UI, Wireframing, dan Pengujian Pengguna</text>

        <!-- Design Process Steps -->
        <g transform="translate(24, 75)">
          <rect x="0" y="0" width="145" height="90" rx="10" fill="#121214" stroke="#27272a"/>
          <text x="16" y="28" fill="#AFFF00" font-family="sans-serif" font-size="11" font-weight="bold">1. User Research</text>
          <text x="16" y="50" fill="#a1a1aa" font-family="sans-serif" font-size="10">Identifikasi kendala</text>
          <text x="16" y="66" fill="#a1a1aa" font-family="sans-serif" font-size="10">peminjaman manual</text>

          <rect x="163" y="0" width="145" height="90" rx="10" fill="#121214" stroke="#27272a"/>
          <text x="179" y="28" fill="#AFFF00" font-family="sans-serif" font-size="11" font-weight="bold">2. Wireframing</text>
          <text x="179" y="50" fill="#a1a1aa" font-family="sans-serif" font-size="10">Eksplorasi tata letak</text>
          <text x="179" y="66" fill="#a1a1aa" font-family="sans-serif" font-size="10">dan navigasi utama</text>

          <rect x="326" y="0" width="145" height="90" rx="10" fill="#121214" stroke="#27272a"/>
          <text x="342" y="28" fill="#AFFF00" font-family="sans-serif" font-size="11" font-weight="bold">3. Prototyping</text>
          <text x="342" y="50" fill="#a1a1aa" font-family="sans-serif" font-size="10">Komponen interaktif</text>
          <text x="342" y="66" fill="#a1a1aa" font-family="sans-serif" font-size="10">dan flow peminjaman</text>
        </g>

        <!-- Role & Period Info Box -->
        <rect x="24" y="190" width="472" height="130" rx="12" fill="#121214" stroke="#27272a"/>
        <text x="40" y="222" fill="#AFFF00" font-family="sans-serif" font-size="11" font-weight="bold">PERAN: UI/UX DESIGNER</text>
        <text x="40" y="242" fill="#ffffff" font-family="sans-serif" font-size="11">Periode: November – Desember 2024 · Tugas Kuliah (Proyek Kelompok)</text>
        <text x="40" y="264" fill="#a1a1aa" font-family="sans-serif" font-size="10">Fokus utama: Perancangan konsep dan antarmuka pengguna aplikasi peminjaman buku.</text>
        <text x="40" y="282" fill="#71717a" font-family="sans-serif" font-size="10">Proses desain mencakup perancangan wireframe, user flow, hingga prototype di Figma.</text>
        <text x="40" y="300" fill="#71717a" font-family="sans-serif" font-size="10">Tools: Figma · Design System · Interactive Prototyping</text>
      </g>
    </g>
  </g>
</svg>
