<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <linearGradient id="bg-siredi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent-siredi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow-siredi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" rx="36" fill="url(#bg-siredi)"/>
  <rect x="2" y="2" width="796" height="996" rx="34" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>

  <!-- Top Mockup Window Header -->
  <rect x="40" y="40" width="720" height="52" rx="14" fill="#1e293b"/>
  <circle cx="70" cy="66" r="7" fill="#ef4444"/>
  <circle cx="94" cy="66" r="7" fill="#eab308"/>
  <circle cx="118" cy="66" r="7" fill="#22c55e"/>
  <rect x="150" y="52" width="340" height="28" rx="8" fill="#0f172a"/>
  <text x="170" y="70" fill="#94a3b8" font-family="monospace" font-size="12">siredi.disdik-banjarmasin.go.id</text>
  <rect x="650" y="52" width="90" height="28" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
  <text x="695" y="70" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DISDIK PORTAL</text>

  <!-- Main System UI Preview -->
  <g transform="translate(40, 115)">
    <!-- Sidebar -->
    <rect x="0" y="0" width="180" height="820" rx="16" fill="#0f172a" stroke="#1e293b"/>
    <rect x="20" y="24" width="36" height="36" rx="10" fill="#38bdf8"/>
    <text x="38" y="48" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="20" text-anchor="middle">S</text>
    <text x="68" y="47" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">SIREDI</text>

    <!-- Nav Items -->
    <rect x="16" y="86" width="148" height="34" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
    <rect x="16" y="86" width="4" height="34" rx="2" fill="#38bdf8"/>
    <text x="36" y="107" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">Reservasi Online</text>

    <text x="36" y="145" fill="#94a3b8" font-family="sans-serif" font-size="12">Status Layanan</text>
    <text x="36" y="180" fill="#94a3b8" font-family="sans-serif" font-size="12">Direktori Sekolah</text>
    <text x="36" y="215" fill="#94a3b8" font-family="sans-serif" font-size="12">Berita &amp; Agenda</text>
    <text x="36" y="250" fill="#94a3b8" font-family="sans-serif" font-size="12">Dashboard Admin</text>
    <text x="36" y="285" fill="#94a3b8" font-family="sans-serif" font-size="12">Pengaturan Supabase</text>

    <!-- Main Content Area -->
    <g transform="translate(200, 0)">
      <!-- Top Metric Cards -->
      <g>
        <rect x="0" y="0" width="160" height="90" rx="14" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="28" fill="#64748b" font-family="sans-serif" font-size="11">Total Reservasi</text>
        <text x="16" y="60" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="900">128</text>
        <rect x="16" y="70" width="90" height="4" rx="2" fill="#38bdf8"/>
      </g>
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="160" height="90" rx="14" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="28" fill="#64748b" font-family="sans-serif" font-size="11">Direktori Sekolah</text>
        <text x="16" y="60" fill="#38bdf8" font-family="sans-serif" font-size="26" font-weight="900">214 Unit</text>
        <rect x="16" y="70" width="110" height="4" rx="2" fill="#38bdf8"/>
      </g>
      <g transform="translate(350, 0)">
        <rect x="0" y="0" width="170" height="90" rx="14" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="28" fill="#64748b" font-family="sans-serif" font-size="11">Backend Database</text>
        <text x="16" y="60" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Supabase</text>
        <circle cx="140" cy="45" r="8" fill="#38bdf8" opacity="0.8"/>
      </g>

      <!-- Reservation Interactive Booking UI Card -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="520" height="340" rx="16" fill="#0f172a" stroke="#1e293b"/>
        <text x="24" y="34" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Formulir Reservasi Layanan Dinas</text>
        <text x="24" y="52" fill="#64748b" font-family="sans-serif" font-size="11">Pemilihan Jadwal, Tanggal, dan Verifikasi Berkas Digital</text>

        <!-- Service Picker Dropdown Mock -->
        <rect x="24" y="75" width="472" height="44" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="40" y="102" fill="#94a3b8" font-family="sans-serif" font-size="12">Layanan: Legalisir Ijazah &amp; Rekomendasi Mutasi Siswa</text>
        <text x="470" y="102" fill="#38bdf8" font-family="sans-serif" font-size="14" text-anchor="end">▼</text>

        <!-- Calendar / Time Slots Mock -->
        <g transform="translate(24, 135)">
          <!-- Slot 1 -->
          <rect x="0" y="0" width="145" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-siredi)"/>
          <text x="72" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Senin, 09:00 - 10:30</text>
          <text x="72" y="44" fill="#22c55e" font-family="sans-serif" font-size="10" text-anchor="middle">● Kuota Tersedia</text>

          <!-- Slot 2 -->
          <rect x="163" y="0" width="145" height="56" rx="8" fill="#1e293b" stroke="#334155"/>
          <text x="235" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Senin, 10:30 - 12:00</text>
          <text x="235" y="44" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">● Penuh</text>

          <!-- Slot 3 -->
          <rect x="326" y="0" width="145" height="56" rx="8" fill="#1e293b" stroke="#334155"/>
          <text x="398" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Senin, 13:30 - 15:00</text>
          <text x="398" y="44" fill="#22c55e" font-family="sans-serif" font-size="10" text-anchor="middle">● Kuota Tersedia</text>
        </g>

        <!-- Status Tracker Preview -->
        <g transform="translate(24, 215)">
          <rect x="0" y="0" width="472" height="100" rx="10" fill="#090d16" stroke="#1e293b"/>
          <text x="20" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Pelacak Status Reservasi #RES-2025-042</text>
          
          <!-- Stepper -->
          <g transform="translate(20, 50)">
            <circle cx="12" cy="12" r="10" fill="#22c55e"/>
            <text x="12" y="16" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">✓</text>
            <text x="12" y="36" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Diajukan</text>

            <line x1="26" y1="12" x2="140" y2="12" stroke="#22c55e" stroke-width="2"/>

            <circle cx="150" cy="12" r="10" fill="#38bdf8"/>
            <text x="150" y="16" fill="#0f172a" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">2</text>
            <text x="150" y="36" fill="#38bdf8" font-size="9" font-family="sans-serif" text-anchor="middle">Diverifikasi</text>

            <line x1="164" y1="12" x2="280" y2="12" stroke="#334155" stroke-width="2"/>

            <circle cx="290" cy="12" r="10" fill="#334155"/>
            <text x="290" y="16" fill="#64748b" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">3</text>
            <text x="290" y="36" fill="#64748b" font-size="9" font-family="sans-serif" text-anchor="middle">Selesai</text>
          </g>
        </g>
      </g>

      <!-- School Directory & Admin Preview -->
      <g transform="translate(0, 470)">
        <rect x="0" y="0" width="520" height="350" rx="16" fill="#0f172a" stroke="#1e293b"/>
        <text x="24" y="34" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Direktori Sekolah &amp; Informasi Pendidikan</text>
        <text x="24" y="52" fill="#64748b" font-family="sans-serif" font-size="11">Akses Informasi Publik &amp; Manajemen Data Magang</text>

        <!-- Mini Table Preview -->
        <g transform="translate(24, 70)">
          <rect x="0" y="0" width="472" height="32" rx="6" fill="#1e293b"/>
          <text x="16" y="20" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">NAMA SEKOLAH</text>
          <text x="240" y="20" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">KECAMATAN</text>
          <text x="400" y="20" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">STATUS</text>

          <rect x="0" y="38" width="472" height="34" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="16" y="59" fill="#e2e8f0" font-family="sans-serif" font-size="10">SMP Negeri 1 Banjarmasin</text>
          <text x="240" y="59" fill="#64748b" font-family="sans-serif" font-size="10">Banjarmasin Tengah</text>
          <text x="400" y="59" fill="#22c55e" font-family="sans-serif" font-size="10">Terakreditasi A</text>

          <rect x="0" y="78" width="472" height="34" rx="6" fill="#0f172a" stroke="#1e293b"/>
          <text x="16" y="99" fill="#e2e8f0" font-family="sans-serif" font-size="10">SMP Negeri 2 Banjarmasin</text>
          <text x="240" y="99" fill="#64748b" font-family="sans-serif" font-size="10">Banjarmasin Barat</text>
          <text x="400" y="99" fill="#22c55e" font-family="sans-serif" font-size="10">Terakreditasi A</text>
        </g>

        <!-- Tech Stack Tags in Card -->
        <g transform="translate(24, 205)">
          <rect x="0" y="0" width="85" height="26" rx="6" fill="#1e293b"/>
          <text x="42" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Next.js 14</text>
          
          <rect x="95" y="0" width="85" height="26" rx="6" fill="#1e293b"/>
          <text x="137" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">TypeScript</text>

          <rect x="190" y="0" width="70" height="26" rx="6" fill="#1e293b"/>
          <text x="225" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">React</text>

          <rect x="270" y="0" width="95" height="26" rx="6" fill="#1e293b"/>
          <text x="317" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Tailwind CSS</text>

          <rect x="375" y="0" width="115" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
          <text x="432" y="17" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Supabase / Postgres</text>
        </g>

        <!-- Project Badge info -->
        <rect x="24" y="250" width="472" height="76" rx="10" fill="#090d16" stroke="#1e293b"/>
        <text x="40" y="274" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">PROYEK MAGANG — TIM MAGANG DISDIK</text>
        <text x="40" y="294" fill="#64748b" font-family="sans-serif" font-size="10">Dinas Pendidikan Kota Banjarmasin · Reservasi Layanan Online &amp; Informasi</text>
        <text x="40" y="312" fill="#64748b" font-family="sans-serif" font-size="10">Pengembangan Berbasis Fullstack Modern Web &amp; PostgreSQL</text>
      </g>
    </g>
  </g>
</svg>
