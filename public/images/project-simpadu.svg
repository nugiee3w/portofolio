          <text x="16" y="58" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">14 / 16 Sesi</text>
          <rect x="16" y="70" width="180" height="6" rx="3" fill="#1e293b"/>
          <rect x="16" y="70" width="158" height="6" rx="3" fill="#818cf8"/>
          <text x="16" y="90" fill="#22c55e" font-family="sans-serif" font-size="9">● Kehadiran Memenuhi Syarat UAS</text>
        </g>

        <!-- KHS GPA Card -->
        <g transform="translate(265, 75)">
          <rect x="0" y="0" width="230" height="100" rx="10" fill="#0b0f19" stroke="#1e293b"/>
          <text x="16" y="28" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold">Indeks Prestasi Semester</text>
          <text x="16" y="58" fill="#818cf8" font-family="sans-serif" font-size="22" font-weight="900">3.82 / 4.00</text>
          <text x="16" y="80" fill="#94a3b8" font-family="sans-serif" font-size="10">Beban Maks. Smt Depan: 24 SKS</text>
        </g>

        <!-- Role & Period Info Box -->
