          <text x="16" y="105" fill="#cbd5e1" font-family="monospace" font-size="10">IF305</text>
          <text x="90" y="105" fill="#ffffff" font-family="sans-serif" font-size="10">Basis Data Terdistribusi</text>
          <text x="280" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="10">3</text>
          <text x="350" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="10">IF-4A</text>
          <text x="420" y="105" fill="#22c55e" font-family="sans-serif" font-size="10">Disetujui</text>

          <!-- Row 3 -->
          <rect x="0" y="124" width="472" height="36" rx="6" fill="#0b0f19" stroke="#1e293b"/>
          <text x="16" y="147" fill="#cbd5e1" font-family="monospace" font-size="10">IF308</text>
          <text x="90" y="147" fill="#ffffff" font-family="sans-serif" font-size="10">Rekayasa Perangkat Lunak</text>
          <text x="280" y="147" fill="#cbd5e1" font-family="sans-serif" font-size="10">3</text>
          <text x="350" y="147" fill="#cbd5e1" font-family="sans-serif" font-size="10">IF-4A</text>
          <text x="420" y="147" fill="#22c55e" font-family="sans-serif" font-size="10">Disetujui</text>

          <!-- Row 4 -->
          <rect x="0" y="166" width="472" height="36" rx="6" fill="#0b0f19" stroke="#1e293b"/>
          <text x="16" y="189" fill="#cbd5e1" font-family="monospace" font-size="10">IF312</text>
          <text x="90" y="189" fill="#ffffff" font-family="sans-serif" font-size="10">Interaksi Manusia &amp; Komputer</text>
          <text x="280" y="189" fill="#cbd5e1" font-family="sans-serif" font-size="10">3</text>
          <text x="350" y="189" fill="#cbd5e1" font-family="sans-serif" font-size="10">IF-4B</text>
          <text x="420" y="189" fill="#22c55e" font-family="sans-serif" font-size="10">Disetujui</text>
