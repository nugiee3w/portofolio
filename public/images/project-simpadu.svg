        <text x="40" y="230" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="bold">PERAN: FRONTEND DEVELOPER</text>
        <text x="40" y="250" fill="#cbd5e1" font-family="sans-serif" font-size="11">Periode: April 2025 – Juli 2025 · Project Based Learning (PBL)</text>
        <text x="40" y="272" fill="#64748b" font-family="sans-serif" font-size="10">Fokus utama: Desain dan implementasi antarmuka pengguna sistem informasi akademik.</text>
        <text x="40" y="290" fill="#64748b" font-family="sans-serif" font-size="10">Pengembangan backend dan perancangan database dikerjakan oleh anggota tim lainnya.</text>
        <text x="40" y="308" fill="#a5b4fc" font-family="monospace" font-size="10">GitHub: github.com/MRizkyaxioo/simpadu-kel3</text>
