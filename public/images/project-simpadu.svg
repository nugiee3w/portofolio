<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <linearGradient id="bg-simpadu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent-simpadu" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-simpadu" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#818cf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" rx="36" fill="url(#bg-simpadu)"/>
  <rect x="2" y="2" width="796" height="996" rx="34" stroke="#312e81" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>

  <!-- Top Mockup Window Header -->
  <rect x="40" y="40" width="720" height="52" rx="14" fill="#1e1b4b"/>
  <circle cx="70" cy="66" r="7" fill="#ef4444"/>
  <circle cx="94" cy="66" r="7" fill="#eab308"/>
  <circle cx="118" cy="66" r="7" fill="#22c55e"/>
  <rect x="150" y="52" width="340" height="28" rx="8" fill="#0f172a"/>
  <text x="170" y="70" fill="#a5b4fc" font-family="monospace" font-size="12">simpadu.akademik-kampus.ac.id</text>
  <rect x="640" y="52" width="100" height="28" rx="8" fill="#818cf8" fill-opacity="0.2"/>
  <text x="690" y="70" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PBL KELOMPOK 3</text>

  <!-- Main System UI Preview -->
  <g transform="translate(40, 115)">
