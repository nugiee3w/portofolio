          <rect x="0" y="40" width="472" height="36" rx="6" fill="#0b0f19" stroke="#1e293b"/>
          <text x="16" y="63" fill="#cbd5e1" font-family="monospace" font-size="10">IF301</text>
          <text x="90" y="63" fill="#ffffff" font-family="sans-serif" font-size="10">Pemrograman Web Lanjut</text>
          <text x="280" y="63" fill="#cbd5e1" font-family="sans-serif" font-size="10">3</text>
          <text x="350" y="63" fill="#cbd5e1" font-family="sans-serif" font-size="10">IF-4A</text>
          <text x="420" y="63" fill="#22c55e" font-family="sans-serif" font-size="10">Disetujui</text>

