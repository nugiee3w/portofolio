    <rect x="0" y="0" width="180" height="820" rx="16" fill="#0f172a" stroke="#1e293b"/>
    <rect x="20" y="24" width="36" height="36" rx="10" fill="#818cf8"/>
    <text x="38" y="48" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="20" text-anchor="middle">S</text>
    <text x="68" y="47" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">SIMPADU</text>

    <!-- Nav Items -->
    <rect x="16" y="86" width="148" height="34" rx="8" fill="#818cf8" fill-opacity="0.15"/>
    <rect x="16" y="86" width="4" height="34" rx="2" fill="#818cf8"/>
    <text x="36" y="107" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="600">Kartu Rencana Studi</text>

    <text x="36" y="145" fill="#94a3b8" font-family="sans-serif" font-size="12">Kartu Hasil Studi (KHS)</text>
    <text x="36" y="180" fill="#94a3b8" font-family="sans-serif" font-size="12">Jadwal &amp; Presensi</text>
