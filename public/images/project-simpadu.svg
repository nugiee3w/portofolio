        <text x="16" y="28" fill="#64748b" font-family="sans-serif" font-size="11">Total SKS Diambil</text>
        <text x="16" y="60" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="900">22 SKS</text>
        <rect x="16" y="70" width="90" height="4" rx="2" fill="#818cf8"/>
      </g>
      <g transform="translate(175, 0)">
