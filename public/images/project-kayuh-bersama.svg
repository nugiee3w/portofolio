          <text x="75" y="24" fill="#e4e4e7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Program Renstra B</text>
          <text x="75" y="42" fill="#71717a" font-family="sans-serif" font-size="9" text-anchor="middle">Indikator IKU-2</text>
        </g>
        <g transform="translate(340, 180)">
          <rect x="0" y="0" width="150" height="60" rx="8" fill="#1e1e24" stroke="#3f3f46"/>
          <text x="75" y="24" fill="#e4e4e7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Program Renstra C</text>
          <text x="75" y="42" fill="#71717a" font-family="sans-serif" font-size="9" text-anchor="middle">Indikator IKU-3</text>
        </g>

