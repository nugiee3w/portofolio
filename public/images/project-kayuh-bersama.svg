    <rect x="0" y="0" width="180" height="820" rx="16" fill="#18181b" stroke="#27272a"/>
    <rect x="20" y="24" width="36" height="36" rx="10" fill="#AFFF00"/>
    <text x="38" y="48" fill="#09090b" font-family="sans-serif" font-weight="900" font-size="20" text-anchor="middle">K</text>
    <text x="68" y="47" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">KAYUH</text>

    <!-- Nav Items -->
    <rect x="16" y="86" width="148" height="34" rx="8" fill="#AFFF00" fill-opacity="0.15"/>
    <rect x="16" y="86" width="4" height="34" rx="2" fill="#AFFF00"/>
    <text x="36" y="107" fill="#AFFF00" font-family="sans-serif" font-size="12" font-weight="600">Pohon Kinerja</text>

    <text x="36" y="145" fill="#a1a1aa" font-family="sans-serif" font-size="12">RPJMD &amp; Renstra</text>
    <text x="36" y="180" fill="#a1a1aa" font-family="sans-serif" font-size="12">Indikator IKU</text>
    <text x="36" y="215" fill="#a1a1aa" font-family="sans-serif" font-size="12">AI Document Analyzer</text>
    <text x="36" y="250" fill="#a1a1aa" font-family="sans-serif" font-size="12">Laporan SKPD</text>
    <text x="36" y="285" fill="#a1a1aa" font-family="sans-serif" font-size="12">Hak Akses Role</text>

