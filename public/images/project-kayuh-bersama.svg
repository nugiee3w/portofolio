        <rect x="0" y="0" width="160" height="90" rx="14" fill="#18181b" stroke="#27272a"/>
        <text x="16" y="28" fill="#71717a" font-family="sans-serif" font-size="11">Total Sasaran</text>
        <text x="16" y="60" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="900">48 IKU</text>
        <rect x="16" y="70" width="80" height="4" rx="2" fill="#AFFF00"/>
      </g>
      <g transform="translate(175, 0)">
