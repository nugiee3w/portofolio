<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <linearGradient id="bg-kayuh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent-kayuh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AFFF00"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="glow-kayuh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#AFFF00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" rx="36" fill="url(#bg-kayuh)"/>
  <rect x="2" y="2" width="796" height="996" rx="34" stroke="#27272a" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>

  <!-- Top Mockup Window Header -->
  <rect x="40" y="40" width="720" height="52" rx="14" fill="#27272a"/>
  <circle cx="70" cy="66" r="7" fill="#ef4444"/>
  <circle cx="94" cy="66" r="7" fill="#eab308"/>
  <circle cx="118" cy="66" r="7" fill="#22c55e"/>
  <rect x="150" y="52" width="340" height="28" rx="8" fill="#18181b"/>
  <text x="170" y="70" fill="#71717a" font-family="monospace" font-size="12">kayuh-bersama.banjarmasinkota.go.id</text>
  <rect x="660" y="52" width="80" height="28" rx="8" fill="#AFFF00" fill-opacity="0.15"/>
  <text x="700" y="70" fill="#AFFF00" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AI READY</text>

  <!-- Main System UI Preview -->
  <g transform="translate(40, 115)">
