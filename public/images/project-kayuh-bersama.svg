          <text x="75" y="24" fill="#e4e4e7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Program Renstra A</text>
          <text x="75" y="42" fill="#71717a" font-family="sans-serif" font-size="9" text-anchor="middle">Indikator IKU-1</text>
        </g>
        <g transform="translate(185, 180)">
