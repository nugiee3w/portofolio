        <text x="16" y="28" fill="#71717a" font-family="sans-serif" font-size="11">Capaian Kinerja</text>
        <text x="16" y="60" fill="#AFFF00" font-family="sans-serif" font-size="26" font-weight="900">94.8%</text>
        <rect x="16" y="70" width="128" height="4" rx="2" fill="#AFFF00"/>
      </g>
      <g transform="translate(350, 0)">
