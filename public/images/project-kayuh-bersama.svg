        <circle cx="134" cy="110" r="16" fill="#27272a"/>
        <path d="M 134 102 L 134 118 M 126 110 L 134 102 L 142 110" stroke="#AFFF00" stroke-width="2" fill="none"/>
        <text x="134" y="145" fill="#a1a1aa" font-family="sans-serif" font-size="10" text-anchor="middle">Upload Laporan_Kinerja.pdf</text>

        <!-- AI Output Box -->
        <rect x="260" y="70" width="236" height="110" rx="12" fill="#121212" stroke="#27272a"/>
        <text x="276" y="94" fill="#AFFF00" font-family="monospace" font-size="10">● Pipeline Active: Gemini-1.5</text>
        <rect x="276" y="106" width="180" height="8" rx="4" fill="#27272a"/>
        <rect x="276" y="122" width="200" height="8" rx="4" fill="#27272a"/>
        <rect x="276" y="138" width="140" height="8" rx="4" fill="#27272a"/>
        <text x="276" y="166" fill="#22c55e" font-family="monospace" font-size="9">Status: Ekstraksi IKU Berhasil (100%)</text>

        <!-- Tech Stack Tags in Card -->
        <g transform="translate(24, 205)">
          <rect x="0" y="0" width="75" height="26" rx="6" fill="#27272a"/>
          <text x="37" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Laravel 11</text>
          
          <rect x="85" y="0" width="65" height="26" rx="6" fill="#27272a"/>
          <text x="117" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">MySQL</text>

          <rect x="160" y="0" width="85" height="26" rx="6" fill="#27272a"/>
          <text x="202" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Bootstrap 5</text>

          <rect x="255" y="0" width="60" height="26" rx="6" fill="#ff6d5a" fill-opacity="0.2" stroke="#ff6d5a" stroke-width="1"/>
          <text x="285" y="17" fill="#ff8f80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">n8n</text>

          <rect x="325" y="0" width="100" height="26" rx="6" fill="#AFFF00" fill-opacity="0.15" stroke="#AFFF00" stroke-width="1"/>
          <text x="375" y="17" fill="#AFFF00" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Google Gemini</text>
        </g>

        <!-- Project Badge info -->
        <rect x="24" y="250" width="472" height="76" rx="10" fill="#141416" stroke="#27272a"/>
        <text x="40" y="274" fill="#a1a1aa" font-family="sans-serif" font-size="11" font-weight="bold">PROYEK TUGAS AKHIR — KELOMPOK</text>
        <text x="40" y="294" fill="#71717a" font-family="sans-serif" font-size="10">Pemerintah Kota Banjarmasin · Analisis Perencanaan &amp; Pelaporan Kinerja</text>
        <text x="40" y="312" fill="#71717a" font-family="sans-serif" font-size="10">Integrasi Otomasi AI dengan Workflow n8n &amp; LLM</text>
      </g>
